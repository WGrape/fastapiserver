# =============================================================================
# 开发环境配置
# =============================================================================

environment: dev

# =============================================================================
# APP - 应用配置
# =============================================================================
app:
  name: "server"
  version: "0.1.0"
  debug: true
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://127.0.0.1:3000"
  log_level: "DEBUG"

# =============================================================================
# JWT - 认证配置
# =============================================================================
jwt:
  secret_key: "dev-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 1440

# =============================================================================
# DATABASE - 数据库配置
# =============================================================================
database:
  url: "mysql+aiomysql://root:root@127.0.0.1:2600/fastapiserver"

# =============================================================================
# REDIS - 缓存配置
# =============================================================================
redis:
  host: "127.0.0.1"
  port: 3100
  password: "secret_redis"
  db: 0
