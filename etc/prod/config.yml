# =============================================================================
# 生产环境配置
# =============================================================================

environment: prod

# =============================================================================
# APP - 应用配置
# =============================================================================
app:
  name: "server"
  version: "0.1.0"
  debug: false
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "https://your-domain.com"
  log_level: "WARNING"

# =============================================================================
# JWT - 认证配置
# =============================================================================
jwt:
  secret_key: "your-production-secret-key-at-least-32-chars-long"
  algorithm: "HS256"
  access_token_expire_minutes: 30

# =============================================================================
# DATABASE - 数据库配置
# =============================================================================
database:
  url: "mysql+aiomysql://user:password@prod-host:3306/fastapiserver"

# =============================================================================
# REDIS - 缓存配置
# =============================================================================
redis:
  host: "prod-redis-host"
  port: 6379
  password: "your-redis-password"
  db: 0
