# =============================================================================
# 测试环境配置
# =============================================================================

environment: test

# =============================================================================
# APP - 应用配置
# =============================================================================
app:
  name: "server"
  version: "0.1.0"
  debug: true
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  log_level: "INFO"

# =============================================================================
# JWT - 认证配置
# =============================================================================
jwt:
  secret_key: "test-secret-key-change-in-production"
  algorithm: "HS256"
  access_token_expire_minutes: 30

# =============================================================================
# DATABASE - 数据库配置
# =============================================================================
database:
  url: "mysql+aiomysql://user:password@localhost:3306/test_database"

# =============================================================================
# REDIS - 缓存配置
# =============================================================================
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 1
